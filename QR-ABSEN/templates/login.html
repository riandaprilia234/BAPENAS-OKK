<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Panitia | QR Absen OKK ETHIVATION</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; min-height: 100vh; background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: rgba(255, 255, 255, 0.95); padding: 40px; border-radius: 20px; text-align: center; max-width: 400px; width: 100%; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        h1 { color: #1a1a2e; margin-bottom: 10px; font-weight: 800; font-size: 24px; }
        p { color: #666; margin-bottom: 25px; font-size: 14px; }
        .error-msg { background: rgba(231, 76, 60, 0.1); color: #c0392b; border: 1px solid rgba(231, 76, 60, 0.3); padding: 10px; border-radius: 8px; font-size: 13px; font-weight: bold; margin-bottom: 20px; }
        input { width: 100%; padding: 15px; margin-bottom: 20px; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; text-align: center; outline: none; transition: 0.3s; }
        input:focus { border-color: #203a43; }
        button { width: 100%; padding: 15px; background: #203a43; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #0f2027; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="card">
        <h1>Login Panitia</h1>
        <p>QR Absen Dinamis — OKK ETHIVATION</p>
        {% if error %}
        <div class="error-msg">⚠️ {{ error }}</div>
        {% endif %}
        <form action="/panitia" method="POST">
            <input type="password" name="pin" placeholder="Masukkan PIN Rahasia" required autofocus>
            <button type="submit">Masuk Dashboard</button>
        </form>
    </div>
</body>
</html>
