<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sesi Absen Ditutup | OKK ETHIVATION 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0F172A, #1E293B, #0F172A);
            color: #F8FAFC;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid #334155;
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .icon-box {
            width: 80px;
            height: 80px;
            background: rgba(239, 68, 68, 0.15);
            border: 2px solid rgba(239, 68, 68, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 38px;
        }
        .badge {
            display: inline-block;
            background: rgba(239, 68, 68, 0.2);
            color: #F87171;
            border: 1px solid rgba(239, 68, 68, 0.4);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 14px;
        }
        h1 {
            font-size: 24px;
            font-weight: 800;
            color: #F8FAFC;
            margin-bottom: 8px;
        }
        p {
            color: #94A3B8;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .hint {
            background: #0F172A;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 16px;
            text-align: left;
            margin-bottom: 24px;
            font-size: 13px;
            color: #CBD5E1;
            line-height: 1.6;
        }
        .btn-keluar {
            display: block;
            width: 100%;
            padding: 14px;
            background: #334155;
            color: #F8FAFC;
            border: 1px solid #475569;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.2s;
        }
        .btn-keluar:hover {
            background: #475569;
        }
        .watermark {
            margin-top: 20px;
            font-size: 11px;
            color: #64748B;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-box">🔒</div>
        <span class="badge">Akses Terkunci</span>
        <h1>{{ error }}</h1>
        <p>{{ detail }}</p>

        <div class="hint">
            💡 <strong>Informasi Mahasiswa:</strong><br>
            1. Sesi ini sudah ditutup oleh panitia.<br>
            2. Jika Anda belum sempat melakukan presensi, silakan lapor kepada Panitia OKK ETHIVATION di ruangan.
        </div>

        <a href="https://www.dinamika.ac.id/" class="btn-keluar">✖ Tutup Halaman Ini</a>
        <p class="watermark">OKK ETHIVATION 2026 — Universitas Dinamika</p>
    </div>
</body>
</html>
