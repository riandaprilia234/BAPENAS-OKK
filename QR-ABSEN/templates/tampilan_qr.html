<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Absen | OKK ETHIVATION</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; height: 100vh; display: flex; flex-direction: column; background: #0f2027; color: white; overflow: hidden; }
        .header { text-align: center; padding: 25px; font-size: 32px; font-weight: 800; background: #203a43; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 10; }
        .main-container { flex: 1; display: flex; flex-direction: row; }
        
        /* Kolom Kiri: QR Code */
        .left-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px; border-right: 2px solid #203a43; }
        #qr-container { background: white; padding: 25px; border-radius: 20px; margin: 20px 0; box-shadow: 0 0 50px rgba(255,255,255,0.1); }
        .timer-box { font-size: 26px; font-weight: bold; margin-top: 10px; color: #ffeb3b; }
        .sesi-title { font-size: 28px; font-weight: bold; color: #4FC3F7; }

        /* Kolom Kanan: Live Feed */
        .right-col { width: 450px; background: rgba(0,0,0,0.2); display: flex; flex-direction: column; }
        .feed-header { background: #1b3038; padding: 20px; text-align: center; font-size: 20px; font-weight: bold; border-bottom: 2px solid #203a43; color: #ffeb3b; }
        .feed-list { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .feed-item { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 12px; border-left: 5px solid #4FC3F7; animation: slideIn 0.4s ease; }
        @keyframes slideIn { from { transform: translateX(50px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .feed-item .nama { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        .feed-item .detail { font-size: 14px; color: #ccc; }
        .feed-item .waktu { font-size: 12px; color: #888; float: right; }

        .footer { padding: 15px 30px; text-align: center; background: #203a43; display: flex; justify-content: space-between; align-items: center; }
        .footer a { color: #4FC3F7; text-decoration: none; font-weight: 600; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <div class="header">📡 QR Absen Dinamis — OKK ETHIVATION</div>
    
    <div class="main-container">
        <div class="left-col">
            <div class="sesi-title">Sesi: {{ sesi.nama }}</div>
            <p style="margin-top:10px; color:#ddd; font-size: 20px;">Silakan scan QR Code di bawah ini</p>
            
            <div id="qr-container"></div>
            <div class="timer-box">QR berubah dalam: <span id="timer">120</span> detik</div>
        </div>

        <div class="right-col">
            <div class="feed-header">🔴 Maba Berhasil Absen</div>
            <div class="feed-list" id="feed-list">
                <div style="text-align:center; margin-top:20px; color:#aaa;">Menunggu absen masuk...</div>
            </div>
        </div>
    </div>

    <div class="footer">
        <span>Sesi ID: {{ sesi_id }}</span>
        <a href="/panitia">← Kembali ke Dashboard</a>
    </div>

    <script>
        const baseUrl = "{{ base_url }}";
        const sesiId = "{{ sesi_id }}";
        const qrContainer = document.getElementById("qr-container");
        const timerEl = document.getElementById("timer");
        const feedList = document.getElementById("feed-list");
        let qrcode = null;
        let timeLeft = 120; 
        
        let lastKnownData = ""; // Untuk mengecek apakah ada data baru

        function generateQR() {
            qrContainer.innerHTML = "";
            const uniqueUrl = baseUrl + "/scan?sesi=" + sesiId + "&t=" + Date.now();
            qrcode = new QRCode(qrContainer, {
                text: uniqueUrl,
                width: 350,
                height: 350,
                colorDark : "#0f2027",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        }

        function updateTimer() {
            timerEl.textContent = timeLeft;
            if (timeLeft <= 0) {
                generateQR();
                timeLeft = 120;
            }
            timeLeft--;
        }

        async function fetchLiveFeed() {
            try {
                const res = await fetch(`/api/live-absen/${sesiId}`);
                if (!res.ok) return;
                const data = await res.json();
                
                // Cek apakah ada perubahan (agar animasi tidak me-reset terus menerus)
                const dataStr = JSON.stringify(data);
                if (dataStr === lastKnownData) return; 
                lastKnownData = dataStr;

                if (data.length === 0) return; // Tetap nunggu

                feedList.innerHTML = ""; // Bersihkan list lama
                data.forEach(maba => {
                    const jam = maba.waktu.split(" ")[1]; // Ambil jam saja
                    const agora = maba.agora || "-";
                    
                    const div = document.createElement('div');
                    div.className = "feed-item";
                    div.innerHTML = `
                        <div class="waktu">${jam}</div>
                        <div class="nama">✅ ${maba.nama}</div>
                        <div class="detail">Agora: ${agora}</div>
                    `;
                    feedList.appendChild(div);
                });
            } catch (err) {
                console.error(err);
            }
        }

        // Jalankan
        generateQR();
        setInterval(updateTimer, 1000);
        
        // Cek live feed setiap 2 detik
        setInterval(fetchLiveFeed, 2000);
    </script>
</body>
</html>
